location = /integration/assistance/verify/ {
    client_max_body_size 4k;
    proxy_pass http://unix:/run/__APP__/web.sock:;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header YNH_USER "";
    proxy_set_header YNH-USER "";
    access_log off;
}

location = /mcp {
    client_max_body_size 2M;
    proxy_pass http://unix:/run/__APP__/web.sock:/mcp;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header YNH_USER "";
    proxy_set_header YNH-USER "";
    proxy_buffering off;
    proxy_read_timeout 120s;
}

location / {
    client_max_body_size 15M;
    proxy_pass http://unix:/run/__APP__/web.sock:;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Django rejects underscore-bearing HTTP headers; normalize SSOwat's name.
    proxy_set_header YNH_USER "";
    proxy_set_header YNH-USER $http_ynh_user;
    proxy_set_header X-Real-IP $remote_addr;
}
