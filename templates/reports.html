{% extends 'base.html' %}{% block content %}<h1>Rapports & audits</h1><p>Exports limités aux sites que vous êtes autorisé à gérer.</p><section class="card narrow"><form method="get"><label for="site">Périmètre</label><select name="site" id="site"><option value="">Tous mes sites</option>{% for site in sites %}<option value="{{ site.pk }}">{{ site }}</option>{% endfor %}</select><div class="actions"><button name="format" value="pdf">↓ PDF inventaire / audit</button><button class="secondary" name="format" value="csv">↓ CSV exploitable</button></div></form><p class="muted">Les rapports incluent l’état, le contrôle et l’affectation du matériel. Chaque génération est journalisée.</p></section>{% endblock %}
