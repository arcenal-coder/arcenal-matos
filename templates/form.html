{% extends 'base.html' %}{% block content %}<div class="pagehead"><div><span class="eyebrow">GESTION</span><h1>{{ title }}</h1></div></div><section class="card narrow"><form method="post" enctype="multipart/form-data">{% csrf_token %}{{ form.non_field_errors }}{% for field in form %}<div class="field">{{ field.label_tag }}{{ field }}{% if field.help_text %}<small>{{ field.help_text }}</small>{% endif %}{{ field.errors }}</div>{% endfor %}<div class="actions"><button type="submit">Enregistrer</button><a class="button secondary" href="{{ cancel_url|default:'/' }}">Annuler</a></div></form></section>{% endblock %}
