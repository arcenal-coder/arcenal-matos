{% extends 'base.html' %}{% block content %}<h1>Notifications</h1><section class="card">{% for item in items %}<div class="listrow"><span><strong>{{ item.title }}</strong><p>{{ item.body }}</p><small>{{ item.created_at }}</small></span>{% if not item.read_at %}<form method="post" action="{% url 'action' 'read' item.pk %}">{% csrf_token %}<button class="secondary">Marquer comme lue</button></form>{% else %}<span class="pill">Lue</span>{% endif %}</div>{% empty %}<div class="empty">Vous êtes à jour. Aucune notification.</div>{% endfor %}</section>{% endblock %}
