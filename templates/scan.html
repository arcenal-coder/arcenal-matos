{% extends 'base.html' %}{% load static %}{% block content %}<h1>Identifier le matériel</h1><p>Scannez un QR code ou un code-barres, ou approchez votre téléphone d’une étiquette NFC contenant le lien de la fiche.</p><section class="card narrow"><button id="start-scan" type="button">Ouvrir la caméra</button><button id="stop-scan" class="secondary" type="button" hidden>Arrêter</button><p id="scan-status" role="status"></p><video id="scan-video" playsinline muted></video><label for="scan-image">Ou lire une photo de l’étiquette</label><input id="scan-image" type="file" accept="image/*"><hr><form method="get"><label for="code">Ou saisir l’identifiant</label><input name="code" id="code" required placeholder="MAT-0001"><button>Ouvrir la fiche</button></form></section>{% endblock %}{% block scripts %}<script src="{% static 'scan.bundle.js' %}" defer></script>{% endblock %}
